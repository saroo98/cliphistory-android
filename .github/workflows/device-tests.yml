# Emulator end-to-end checks with a real Shizuku-compatible service started over adb.
#
#   pull_request, push to main   smoke: API 30 and 36, official Shizuku 13.6.0 over adb
#   nightly schedule, manual run full:  API 30, 31, 33, 34, 35, 36, 37 x {shizuku-adb, shizako-adb, shizako-root}
#   shizako-root checks the deliberate refusal of a root (UID 0) server: refusal message shown,
#   no recorder helper started, clipboard not cleared (Android clears it when root reads it).
#
# Only the isolated app.cliphistory.validation build and synthetic data are used, on disposable
# google_apis x86_64 emulators. Service APKs are the projects' official GitHub release assets,
# verified against pinned SHA-256 digests (tools/ci/fetch-service-apk.sh). Never signs, no secrets.
# The device logic lives in tools/ci/emulator-e2e.sh so it can be run locally as well.
name: Device tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: Space-separated UiSmokeInstrumentation suites to run instead of the full list
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Superseded pull request runs are cancelled; main commits and nightly runs each finish.
concurrency:
  group: device-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build validation APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic # MIT-licensed actions/cache provider; see ci.yml

      - name: Install pinned Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;36.0.0" < /dev/null

      - name: Build validation app and test APK
        run: ./gradlew --no-daemon -PvalidationBuild :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Stage APKs
        run: |
          mkdir -p validation-apks
          cp app/build/outputs/apk/debug/app-debug.apk validation-apks/cliphistory-validation.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk validation-apks/cliphistory-validation-test.apk
          (cd validation-apks && sha256sum ./*.apk | tee SHA256SUMS)

      - name: Fetch pinned service APKs once for all emulator jobs
        # One download per service instead of one per job, with retries and SHA-256 pins.
        # Each emulator job verifies the pin again before installing.
        run: |
          bash tools/ci/fetch-service-apk.sh shizuku validation-apks/service-apk
          bash tools/ci/fetch-service-apk.sh shizako validation-apks/service-apk

      - name: Upload validation APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-apks
          path: validation-apks/
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: API ${{ matrix.api }} / ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 40 }}
    # Android 17 jobs still run and report, but do not fail the workflow. On hosted Linux runners
    # the API 37 image's graphics driver aborts surfaceflinger about every 30 seconds after boot
    # ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma"). Android restarts while
    # the app is installed and started, so setup fails with "Activity class ... does not exist".
    # Tried without effect (November 2026): swiftshader_indirect, swangle_indirect, -gpu guest
    # (falls back to lavapipe), -feature -GLDMA2, -feature -GLDMA,-GLDMA2, and emulator 37.2.12
    # instead of 37.2.13. The same image runs without the crash on a local Windows emulator, and
    # Android 17 is covered by local API 37 runs meanwhile.
    continue-on-error: ${{ matrix.api == '37.0' }}
    strategy:
      fail-fast: false
      matrix:
        # API 37's SDK package names are android-37.0 (platforms and system image).
        api: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["30","31","33","34","35","36","37.0"]' || '["30","36"]') }}
        service: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["shizuku-adb","shizako-adb","shizako-root"]' || '["shizuku-adb"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validation APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-apks
          path: validation-apks

      - name: Enable KVM
        # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Turn off emulator clipboard sharing (precaution)
        # A windowed emulator with host clipboard sharing on re-posts clips as plain text from
        # SYSTEM_UID, dropping android.content.extra.IS_SENSITIVE; sensitive-live then fails with
        # EMULATOR_CLIPBOARD_SYNC_STRIPS_SENSITIVE_FLAG. Headless (-no-window) emulators, as used
        # here, were observed to keep the flag, so this is only belt-and-braces. The Linux path of
        # the emulator's Qt settings file is unverified on GitHub runners. The runner is ephemeral,
        # so the file is simply replaced.
        run: |
          conf="${XDG_CONFIG_HOME:-$HOME/.config}/Android Open Source Project/Emulator.conf"
          mkdir -p "$(dirname "$conf")"
          printf '[set]\nclipboardSharing=false\n' > "$conf"
          cat "$conf"

      - name: Install the Android emulator (retried)
        # The emulator runner installs the emulator without retrying, and one nightly download
        # arrived damaged ("Error on ZipFile unknown archive"). Once it is installed here, the
        # runner's own install step has nothing left to download.
        run: |
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator --channel=0 < /dev/null > /dev/null && exit 0
            echo "Emulator install attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Run emulator checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_SERVICE: ${{ matrix.service }}
          E2E_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'smoke' }}
          E2E_SUITES: ${{ inputs.suites }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis # adb root works on google_apis images (needed by shizako-root)
          arch: x86_64
          # pixel_6 (1080 x 2400, 420 dpi) matches the local 1.4.6 audit AVDs. The runner image's
          # command-line tools 12.0 have no pixel_8_pro profile, so AVD creation failed with it.
          profile: pixel_6
          avd-name: cliphistory-ci
          cores: 4
          ram-size: 4096M # current emulators raise smaller google_apis AVDs to 4096 MB anyway
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ci/emulator-e2e.sh --serial emulator-5554 --expect-avd cliphistory-ci --apk validation-apks/cliphistory-validation.apk --test-apk validation-apks/cliphistory-validation-test.apk --service-cache validation-apks/service-apk --output reports/ci/device

      - name: Upload device results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-results-api${{ matrix.api }}-${{ matrix.service }}
          path: reports/ci/device/
          if-no-files-found: warn
          retention-days: 14
