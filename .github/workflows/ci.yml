# Build, unit-test and lint ClipHistory (roadmap G1).
#
# Never signs and never uses secrets: -PunsignedRelease ignores any local signing files, so the
# release output is app-release-unsigned.apk. The APK digests in the job summary come from the
# checked-out commit (a merge commit for pull requests); F-Droid reproducibility is checked
# against the recorded release commit, not against these CI artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Pushes to main are grouped
# by commit, so every main commit keeps its own complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT-licensed cache built on actions/cache, instead of the default proprietary
          # "enhanced" provider and its separate terms of use. Wrapper validation stays on:
          # the checked-in gradle-wrapper.jar is checked against Gradle's published checksums.
          cache-provider: basic

      - name: Install pinned Android SDK packages
        # The runner image's SDK licences are already accepted; nothing is auto-accepted here,
        # so a new licence fails this step visibly instead of being agreed to silently.
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;36.0.0" < /dev/null

      - name: Static source audit
        run: python3 tools/audit_source.py

      - name: Unit tests, release lint and APKs
        run: >-
          ./gradlew --no-daemon -PunsignedRelease
          :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease

      - name: Record APK digests
        working-directory: app/build/outputs/apk
        run: |
          {
            echo '### APK SHA-256'
            echo '```'
            sha256sum release/app-release-unsigned.apk debug/app-debug.apk
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cliphistory-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cliphistory-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
