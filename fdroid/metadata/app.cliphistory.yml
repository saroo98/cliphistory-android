AutoName: ClipHistory
Summary: Private clipboard history with an authorised Shizuku recorder
Description: |-
    Keep a rolling, searchable history of copied plain text on your device.
    Tap an entry to copy it, view full text, pause recording, choose a history
    limit, and open history from a Quick Settings tile. Light, dark and system
    appearance are supported.

    Requires Android 14 or later, the primary device profile, and Shizuku API 13
    or newer running as the non-root shell user. Install and start Shizuku
    separately. Guided setup is included. After reboot, start Shizuku again.
    Saved history remains readable while Shizuku is stopped.

    No internet permission, accounts, ads, analytics, cloud sync or keyboard
    replacement. History is in private, no-backup storage; screenshots are
    blocked. Clips marked sensitive, unsupported payloads and text over 64 KiB
    are skipped. Sensitivity depends on the source app marking a clip correctly.
    The recorder uses Android internal clipboard interfaces, so compatibility
    can vary across operating system and manufacturer versions.

